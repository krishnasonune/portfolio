<section class="modal-section">
    <div class="modal">
        <span class="close">
            <img src="assets/x.svg" alt="close" class="close-icon" (click)="close()">
        </span>
        <span class="text-content">
            <h1 class="heading">{{popup_data.title}}</h1>
            <h4 class="description">{{popup_data.desc}}</h4>
        </span>
    </div>
</section>
